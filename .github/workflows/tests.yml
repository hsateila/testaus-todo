name: Tests
description: Käynnistää yksikkö- ja end-to-end testit mergellä, nyt taas uudestaan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5173/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat server.log
          exit 1

      - name: Run end-to-end tests
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:e2e

      - name: Show server log on failure
        if: failure()
        run: cat server.log

      - name: Stop application
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
